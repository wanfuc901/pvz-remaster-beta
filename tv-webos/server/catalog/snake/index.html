<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rắn săn mồi</title>
<style>
  html, body { margin: 0; height: 100%; background: #07130c; color: #e7f5ec; font-family: Arial, sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hud { display: flex; width: 90vmin; justify-content: space-between; font-size: 3.2vmin; margin-bottom: 1.5vmin; }
  canvas { background: #0d1f15; border-radius: 1.5vmin; box-shadow: 0 0 0 0.4vmin #1f3a2a; }
  .msg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none; }
  .msg h1 { font-size: 7vmin; margin: 0 0 2vmin; }
  .msg p { font-size: 3vmin; margin: 0.6vmin; opacity: 0.85; }
  button { font: inherit; font-size: 3vmin; padding: 1.2vmin 3vmin; border-radius: 1.2vmin; border: 0; background: #16a34a; color: #fff; margin-top: 2vmin; pointer-events: auto; }
  button:focus { outline: 0.5vmin solid #fde047; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Điểm: <b id="score">0</b></span><span>Kỷ lục: <b id="best">0</b></span></div>
  <canvas id="c" width="600" height="600"></canvas>
</div>
<div class="msg" id="msg">
  <h1 id="title">Rắn săn mồi</h1>
  <p>D-pad / tay cầm: đổi hướng · OK / A: bắt đầu, tạm dừng</p>
  <button id="start">Bắt đầu</button>
</div>
<script src="/sdk/tvwebos-sdk.js"></script>
<script>
(function () {
  var N = 20, canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var size = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.8);
  canvas.width = canvas.height = size; canvas.style.width = canvas.style.height = size + 'px';
  var cell = size / N;
  var snake, dir, nextDir, food, score, best = 0, running = false, over = false, timer = null;
  var msg = document.getElementById('msg'), title = document.getElementById('title'), startBtn = document.getElementById('start');
  var tv = window.tvwebos;

  tv.ready.then(function () {
    return tv.storage.get('best');
  }).then(function (v) { if (typeof v === 'number') { best = v; draw(); } }).catch(function () {});

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; over = false; placeFood();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }
  function setDir(x, y) {
    if (!running) return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x: x, y: y };
  }
  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; placeFood(); schedule(); } else snake.pop();
    draw();
  }
  function speed() { return Math.max(60, 160 - score * 4); }
  function schedule() { clearInterval(timer); timer = setInterval(step, speed()); }
  function start() {
    if (over || !snake) reset();
    running = true; msg.style.display = 'none'; schedule(); draw();
  }
  function pause() { running = false; clearInterval(timer); title.textContent = 'Tạm dừng'; startBtn.textContent = 'Tiếp tục'; msg.style.display = 'block'; startBtn.focus(); }
  function gameOver() {
    running = false; over = true; clearInterval(timer);
    if (score > best) { best = score; tv.storage.set('best', best).catch(function () {}); }
    title.textContent = 'Kết thúc: ' + score + ' điểm'; startBtn.textContent = 'Chơi lại'; msg.style.display = 'block'; startBtn.focus(); draw();
  }
  function draw() {
    document.getElementById('score').textContent = score || 0;
    document.getElementById('best').textContent = best;
    ctx.fillStyle = '#0d1f15'; ctx.fillRect(0, 0, size, size);
    if (!snake) return;
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.38, 0, Math.PI * 2); ctx.fill();
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
    });
  }

  startBtn.addEventListener('click', start);
  // Keys from the TV remote (and the phone's D-pad, forwarded by the SDK).
  tv.onKey(function (key, action) {
    if (action !== 'down') return false;
    if (key === 'ArrowUp') { setDir(0, -1); return running; }
    if (key === 'ArrowDown') { setDir(0, 1); return running; }
    if (key === 'ArrowLeft') { setDir(-1, 0); return running; }
    if (key === 'ArrowRight') { setDir(1, 0); return running; }
    if (key === 'Enter' && running) { pause(); return true; }
    return false;
  });
  // Phone gamepad.
  var last = 0, B = tv.Buttons;
  tv.onGamepad(function (s) {
    var pressed = s.buttons & ~last; last = s.buttons;
    if (pressed & (1 << B.UP)) setDir(0, -1);
    if (pressed & (1 << B.DOWN)) setDir(0, 1);
    if (pressed & (1 << B.LEFT)) setDir(-1, 0);
    if (pressed & (1 << B.RIGHT)) setDir(1, 0);
    if (pressed & ((1 << B.A) | (1 << B.START))) { if (running) pause(); else start(); }
  });
  tv.onBack(function () { if (running) { pause(); return true; } return false; });
  tv.onFocusChange(function (focused) { if (!focused && running) pause(); });
  reset(); draw(); startBtn.focus();
})();
</script>
</body>
</html>
