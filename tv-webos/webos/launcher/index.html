<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TV WebOS</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f17; color: #eef2f8; font-family: Arial, sans-serif; }
  #frame { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: none; }
  #setup { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; }
  .card { width: 760px; padding: 48px; border-radius: 24px; background: #161b26; }
  h1 { font-size: 40px; margin: 0 0 12px; }
  p { font-size: 22px; color: #aab3c5; line-height: 1.5; margin: 0 0 24px; }
  input { width: 100%; box-sizing: border-box; font-size: 28px; padding: 16px 20px; border-radius: 14px; border: 3px solid #2a3244; background: #0f141d; color: #fff; }
  input:focus, button:focus { outline: none; border-color: #4f8cff; }
  button { margin-top: 20px; font-size: 26px; padding: 14px 30px; border-radius: 14px; border: 3px solid transparent; background: #4f8cff; color: #fff; }
  #err { color: #f87171; font-size: 22px; margin-top: 18px; min-height: 28px; }
</style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen"></iframe>
<div id="setup">
  <div class="card">
    <h1>TV WebOS</h1>
    <p>Nhập địa chỉ server TV WebOS trong mạng nội bộ (ví dụ 192.168.1.10:8686).</p>
    <input id="addr" placeholder="192.168.1.10:8686">
    <button id="go">Kết nối</button>
    <div id="err"></div>
  </div>
</div>
<script src="webOSTV.js"></script>
<script src="config.js"></script>
<script src="launcher.js"></script>
</body>
</html>
